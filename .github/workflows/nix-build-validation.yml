name: Nix packaging diagnostics

on:
  push:
    branches: [fix/nixos-build-validation]

permissions:
  contents: read
  actions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Export failed build log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/Tr0sT/paperclip/actions/jobs/115200243620/logs > /tmp/nix-build.log
          tail -200 /tmp/nix-build.log > /tmp/nix-build-tail.txt
          cat /tmp/nix-build-tail.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nix-build-diagnostics
          path: /tmp/nix-build-tail.txt
          retention-days: 7
